# Refer for explanation to following link:
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      run: pnpm exec prettier --write {staged_files}
      glob: "*.{js,mjs,cjs,ts,mts,cts,json,md,yml,yaml}"
      exclude:
        - "apps/**"
        - "pnpm-lock.yaml"
      stage_fixed: true
    - name: oxlint
      run: pnpm exec oxlint --fix {staged_files}
      glob: "*.{js,mjs,cjs,ts,mts,cts}"
      exclude: "apps/**"
      stage_fixed: true
    - name: eslint
      run: pnpm exec eslint --fix {staged_files}
      glob: "*.{ts,mts}"
      exclude: "apps/**"
      stage_fixed: true
