name: Test & Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint & Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR branch naming convention
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! [[ "$HEAD_REF" =~ ^(feat|fix|docs|test|refactor|chore|release)/[a-z0-9-]+$ ]]; then
            echo "::error::Branch '$HEAD_REF' violates CONTRIBUTE.md naming convention. Expected '<category>/<kebab-case-slug>' (e.g. 'feat/crypto-subtle', 'chore/lint-guardrails')."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting & typecheck
        run: pnpm lint

      - name: Build distribution packages
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Run unit tests
        run: pnpm run --if-present test

      - name: Run compile-time type tests
        run: pnpm run --if-present test:types

      - name: Run package smoke test
        run: pnpm run --if-present test:smoke

  docs:
    name: Docs (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs app
        run: pnpm --filter webhook-kit-docs lint

      - name: Typecheck docs app
        run: pnpm --filter webhook-kit-docs typecheck

      - name: Build docs app
        run: pnpm --filter webhook-kit-docs build
